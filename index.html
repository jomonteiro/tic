<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe</h1>

    <div class="controls">
      <button id="newGameBtn" aria-label="Novo jogo">Novo jogo</button>
      <button id="blackBtn" aria-label="Mudar tabuleiro para preto">Tabuleiro preto</button>
    </div>

    <div id="status" class="status" aria-live="polite">Vez do jogador X</div>

    <div id="board" class="board" role="grid" aria-label="Tabuleiro do jogo">
      <div class="cell" data-index="0" role="button" tabindex="0" aria-label="Célula 1"></div>
      <div class="cell" data-index="1" role="button" tabindex="0" aria-label="Célula 2"></div>
      <div class="cell" data-index="2" role="button" tabindex="0" aria-label="Célula 3"></div>
      <div class="cell" data-index="3" role="button" tabindex="0" aria-label="Célula 4"></div>
      <div class="cell" data-index="4" role="button" tabindex="0" aria-label="Célula 5"></div>
      <div class="cell" data-index="5" role="button" tabindex="0" aria-label="Célula 6"></div>
      <div class="cell" data-index="6" role="button" tabindex="0" aria-label="Célula 7"></div>
      <div class="cell" data-index="7" role="button" tabindex="0" aria-label="Célula 8"></div>
      <div class="cell" data-index="8" role="button" tabindex="0" aria-label="Célula 9"></div>
    </div>

    <footer class="note">Clique numa célula para jogar. O botão "Tabuleiro preto" aplica imediatamente o estilo preto sem alterar a lógica do jogo.</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
